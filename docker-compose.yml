name: final

services:
  final-mongo:
    image: mongo:7.0
    restart: always
    container_name: final-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    command: ["mongod", "--bind_ip", "*", "--auth"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      # ATENCIÓN: aquí montamos el **archivo** init-mongo.js del host
      - ./docker/mongo/init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [ "CMD","mongosh","--quiet",
              "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?authSource=admin",
              "--eval","db.runCommand({ ping: 1 }).ok" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ final-net ]

  final-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "echo", "ruok", "|", "nc", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  final-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: final-kafka
    depends_on:
      - final-zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: final-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://final-kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9094:9094"
    networks: [ final-net ]
    healthcheck:
      test: [ "CMD", "bash", "-lc", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 40s

  final-kafka-consumer:
    build:
      context: .
      dockerfile: app/kafka_consumer/Dockerfile
    container_name: final-kafka-consumer
    env_file: .env
    depends_on:
      - final-kafka
      - final-mongo
    networks: [ final-net ]
    restart: unless-stopped

  final-match-expander:
    build:
      context: .
      dockerfile: app/match-expander/Dockerfile
    container_name: final-match-expander
    env_file: .env
    depends_on:
      - final-kafka
      - final-mongo
    networks: [ final-net ]
    restart: unless-stopped

  final-dashboard:
    build:
      context: .
      dockerfile: app/dashboard/Dockerfile
    container_name: final-dashboard
    depends_on:
      - final-mongo
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=${MONGO_INITDB_DATABASE}
      - RIOT_API_KEY=${RIOT_API_KEY}
      - PYTHONPATH=/app:/app/src
    ports:
      - "8501:8501"
    networks:
      - final-net
    command: >
      streamlit run /app/src/dashboard/dashboard_streamlit.py
      --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  final-net:
    driver: bridge