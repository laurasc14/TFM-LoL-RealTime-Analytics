name: final

services:
  final-mongo:
    image: mongo:7.0
    container_name: final-mongo
    restart: always
    command: ["mongod", "--bind_ip", "*", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [
        "CMD-SHELL",
        "mongosh --quiet mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?authSource=admin --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
      ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ final-net ]

  final-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: final-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./config/zoo.cfg:/etc/zookeeper/conf/zoo.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ final-net ]

  final-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: final-kafka
    depends_on:
      final-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: final-zookeeper:2181

      # Listeners (interno del cluster + publicado)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://final-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 1 broker (evita errores de RF>1)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      # Crea topics automáticos (útil para arrancar)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./docker/kafka/init/init-topics.sh:/init-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 20s
    networks: [ final-net ]

  final-kafka-consumer:
    build:
      context: app/kafka_consumer
      dockerfile: Dockerfile
    container_name: final-kafka-consumer
    env_file: .env
    depends_on:
      final-kafka:
        condition: service_healthy
      final-mongo:
        condition: service_healthy
    environment:
      # usa el hostname interno de Kafka (coincide con el advertised)
      BOOTSTRAP: final-kafka:9092
      TOPIC: ${IN_TOPIC}
      GROUP: ${GROUP_ID}
      MONGO_URI: ${MONGO_URI}
      DB_NAME: lol_realtime
      COLL_NAME: matches_raw
    networks: [ final-net ]
    restart: unless-stopped

  final-match-expander:
    build:
      context: app/match_expander
      dockerfile: Dockerfile
    container_name: final-match-expander
    env_file: .env
    depends_on:
      final-kafka:
        condition: service_healthy
      final-mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_INITDB_DATABASE}
      MONGO_COLLECTION: matches_full
      RAW_TOPIC: lol.raw
      KAFKA_BOOTSTRAP: final-kafka:9092
      KAFKA_GROUP_ID: match-expander
    networks: [ final-net ]
    restart: unless-stopped

  final-dashboard:
    build:
      context: app/dashboard
    container_name: final-dashboard
    env_file: .env
    depends_on:
      final-mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_INITDB_DATABASE}
      RIOT_API_KEY: ${RIOT_API_KEY}
      PYTHONPATH: /app:/app/src
    ports:
      - "8501:8501"
    command: >
      streamlit run /app/src/dashboard/dashboard_streamlit.py
      --server.port=8501 --server.address=0.0.0.0
    networks: [ final-net ]
    restart: unless-stopped

  final-riot-fetcher:
    build:
      context: app/riot_fetcher
      dockerfile: Dockerfile
    container_name: final-riot-fetcher
    env_file: .env
    depends_on:
      final-kafka:
        condition: service_healthy
    networks: [ final-net ]
    restart: unless-stopped

  final-riot-producer:
    build:
      context: app/riot_producer
      dockerfile: Dockerfile
    container_name: final-riot-producer
    env_file: .env
    depends_on:
      final-kafka:
        condition: service_healthy
    networks: [ final-net ]
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  final-net:
    driver: bridge
