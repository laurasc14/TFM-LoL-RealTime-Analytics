version: '3.8'

services:

  final-riot-fetcher:
    build:
      context: .
      dockerfile: app/riot_fetcher/Dockerfile
    container_name: final-riot-fetcher
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    env_file:
      - .env
    environment:
      - RIOT_API_KEY="RGAPI-2d148fa7-7edc-44bd-ad3c-900a6d6af06d"
      - SUMMONER_NAME=MEMENTO MØRI#提莫國王
      - RIOT_REGION=europe
    volumes:
      - ./src:/app/src
    networks:
      - tfm-net

  final-kafka-consumer:
    build:
      context: .
      dockerfile: app/kafka_consumer/Dockerfile
    container_name: final-kafka-consumer
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
    networks:
      - tfm-net

  mongo:
    image: mongo:6.0
    container_name: final-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: lol
    restart: always
    ports:
      - 27017:27017
    networks:
      - tfm-net

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - tfm-net

  kafka1:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - tfm-net

  kafka2:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - tfm-net

  kafka3:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - tfm-net

  final-dashboard:
    build:
      context: .
      dockerfile: app/dashboard/Dockerfile
    container_name: final-dashboard
    ports:
      - "8501:8501"
    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017/lol?authSource=admin
      MONGO_DB: lol
      MONGO_PROCESSED_COLL: matches_processed
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093,kafka3:9094
      KAFKA_TOPIC: matches
      RIOT_API_KEY: ${RIOT_API_KEY}
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./src/dashboard/dashboard_streamlit.py:/app/dashboard_streamlit.py:ro
      - ./src:/app/src
    networks:
      - tfm-net

  final-backfill-api:
    build:
      context: .
      dockerfile: app/riot_fetcher/Dockerfile
    container_name: final-backfill-api
    environment:
      - PYTHONPATH=/app/src
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9093,kafka3:9094
      # Opcional: fija aquí RIOT_API_KEY si quieres evitar pasarla desde la UI
      # - RIOT_API_KEY=RGAPI-xxxx
    command: >
      sh -lc "uvicorn api.backfill_api:app --host 0.0.0.0 --port 8000"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8000:8000"

networks:
  tfm-net:
    driver: bridge
